name: Q5 Project Sync

on:
  push:
    paths:
      - '.github/workflows/q5-project-sync.yml'
      - '.github/scripts/q5_project_sync_v2.sh'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

# Creating/editing an issue can emit several events (opened + one labeled event
# per label). Keep only the newest sync so runs do not race each other.
# Push/dispatch events have no TARGET_ISSUE and therefore reconcile the full project.
concurrency:
  group: q5-project-sync-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.project_apt || secrets.PROJECT_PAT || secrets.PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: jan-lozano-dev
      PROJECT_NUMBER: 2
      TARGET_ISSUE: ${{ github.event.issue.number || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project token
        run: |
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "No project token secret found. Expected project_apt, PROJECT_PAT, or PROJECT_TOKEN."
            exit 1
          fi

      - name: Sync Q5 Optimal project
        run: bash .github/scripts/q5_project_sync_v2.sh
