name: Q5 Project Sync

on:
  push:
    paths:
      - '.github/workflows/q5-project-sync.yml'
      - '.github/scripts/q5_project_sync.sh'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_PAT || secrets.PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: jan-lozano-dev
      PROJECT_TITLE: Q5 Optimal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project token
        run: |
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "Neither PROJECT_PAT nor PROJECT_TOKEN exists as an Actions repository secret."
            exit 1
          fi

      - name: Sync Q5 Optimal project
        run: bash .github/scripts/q5_project_sync.sh
